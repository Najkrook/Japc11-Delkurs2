<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sakura-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <!-- Background badge -->
  <rect width="64" height="64" rx="15" fill="url(#sakura-bg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Cap Skullcap (Lower headband) -->
  <path d="M20 33 v7.5 c0 6.5 24 6.5 24 0 v-7.5 c-5 3.2 -19 3.2 -24 0 Z" fill="#fed7aa"/>

  <!-- Mortarboard 3D Edge -->
  <polygon points="11,26 11,28.5 32,39.5 53,28.5 53,26 32,37" fill="#fbcfe8"/>

  <!-- Mortarboard Top Face -->
  <polygon points="32,15 53,26 32,37 11,26" fill="#ffffff"/>

  <!-- Center Button -->
  <circle cx="32" cy="26" r="2.5" fill="url(#gold-grad)"/>

  <!-- Tassel Cord -->
  <path d="M32 26 C43 26 49.5 28.5 50 35 L50 44" fill="none" stroke="url(#gold-grad)" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Tassel Ring & Fringe -->
  <rect x="48.5" y="43.5" width="3" height="1.5" rx="0.5" fill="#b45309"/>
  <polygon points="48,45 52,45 52.8 51.5 47.2 51.5" fill="url(#gold-grad)"/>
</svg>